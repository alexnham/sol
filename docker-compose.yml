services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HELIUS_API_KEY: ${HELIUS_API_KEY:?Set HELIUS_API_KEY before starting the container}
      DISTRIBUTOR_PROGRAM_ID_DEVNET: ${DISTRIBUTOR_PROGRAM_ID_DEVNET:?Set the deployed devnet distributor Program ID}
      DISTRIBUTOR_PROGRAM_ID_MAINNET: ${DISTRIBUTOR_PROGRAM_ID_MAINNET:-}
      HOST: 0.0.0.0
      PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./generated-keys:/app/generated-keys
    restart: unless-stopped
